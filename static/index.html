<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hardware Dashboard</title>
    <link rel="stylesheet" href="/static/style.css?v=12">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    
    <!-- GridStack.js -->
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-left" style="display: flex; align-items: center; gap: 1rem;">
            <button id="mobileMenuBtn" class="icon-btn mobile-only">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1>NEON<span>AGENT</span> // HARDWARE MONITOR</h1>
        </div>
        <div class="header-widgets" id="headerWidgets">
            <div class="mini-widget" id="widget-cpuLoad" title="CPU 整體負載"><span class="widget-label">CPU</span><span class="widget-val">--%</span></div>
            <div class="mini-widget" id="widget-gpuLoad" title="GPU 整體負載"><span class="widget-label">GPU</span><span class="widget-val">--%</span></div>
            <div class="mini-widget" id="widget-ramLoad" title="記憶體使用率"><span class="widget-label">RAM</span><span class="widget-val">--%</span></div>
        </div>
        <div class="header-right" style="display: flex; align-items: center; gap: 1.5rem;">
            <div id="connectionStatus" style="color: #45a29e;">連線中...</div>
            
            <button id="clearBtn" class="icon-btn" title="重置與清除所有圖表" style="padding: 0; background: transparent; border: none; width: 22px; height: 22px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
            </button>
            
            <div class="alert-icon-wrapper" id="alertBtn" title="警報紀錄">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="alertBadge" class="alert-badge">0</span>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="modal-backdrop">
        <div class="modal-content">
            <div class="modal-header">
                <h3>警報歷史紀錄</h3>
                <button id="closeAlertBtn" class="close-btn">&times;</button>
            </div>
            <div id="alertHistoryList" class="alert-list">
                <div class="no-alerts">目前沒有任何警報紀錄</div>
            </div>
        </div>
    </div>
    
    <div class="main-container">
        <div id="sidebarOverlay" class="sidebar-overlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="chat-history" id="chatHistory">
                <div class="message system">
                    <div>Agent 準備就緒。我可以為您建立圖表、設定警報或查詢歷史數據。</div>
                    <div class="message-time">System</div>
                </div>
            </div>
            <div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="例如：幫我加上 CPU 和 GPU 溫度的圖表">
                    <button id="sendBtn">執行</button>
                </div>
                <div class="manual-add-section" style="display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem;">
                    <select id="sensorSelect" style="width: 100%; padding: 0.8rem; border-radius: 4px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); color: var(--accent); font-family: var(--font-main); outline: none;">
                        <option value="">載入可用感測器中...</option>
                    </select>
                    <div style="display: flex; gap: 0.8rem;">
                        <select id="timeframeSelect" style="flex: 1; padding: 0.8rem; border-radius: 4px; background: rgba(0,0,0,0.5); border: 1px solid var(--panel-border); color: var(--accent); font-family: var(--font-main); outline: none;">
                            <option value="5">過去 5 分鐘</option>
                            <option value="15" selected>過去 15 分鐘</option>
                            <option value="60">過去 1 小時</option>
                        </select>
                        <button id="manualAddBtn" style="white-space: nowrap; flex-shrink: 0;">加入圖表</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="dashboard-area">
            <div id="emptyState" class="empty-state">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <h2>SYSTEM STANDBY</h2>
                <p>在左側對話框輸入指令，或從下拉選單新增圖表</p>
            </div>
            <div id="dashboard" class="grid-stack"></div>
        </div>
    </div>

    <script src="/static/script.js?v=17"></script>
</body>
</html>
