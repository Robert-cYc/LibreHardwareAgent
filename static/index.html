<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 驅動硬體監控儀表板</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <div class="pulse"></div>
                <h1>Antigravity Telemetry</h1>
            </div>
            <p class="subtitle">AI-Driven Dynamic Hardware Monitor</p>
        </header>

        <main>
            <div class="chat-section glass-panel">
                <div class="chat-history" id="chatHistory">
                    <div class="message system">系統已啟動。請輸入自然語言指令，例如：「列出 CPU 趨勢圖」、「加入 GPU 溫度」或「拿掉 CPU 趨勢圖」。</div>
                </div>
                <div class="input-area">
                    <input type="text" id="chatInput" placeholder="告訴 AI 你想監控什麼..." autocomplete="off">
                    <button id="sendBtn">發送指令</button>
                </div>
                <div class="manual-add-section" style="display: flex; gap: 1rem; align-items: center;">
                    <select id="timeframeSelect" style="padding: 0.8rem; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); color: #fff; font-family: var(--font-main); outline: none;">
                        <option value="5">過去 5 分鐘</option>
                        <option value="15" selected>過去 15 分鐘</option>
                        <option value="60">過去 1 小時</option>
                    </select>
                    <select id="sensorSelect" style="flex: 1; padding: 0.8rem; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid var(--panel-border); color: #fff; font-family: var(--font-main); outline: none;">
                        <option value="">載入可用感測器中...</option>
                    </select>
                    <button id="manualAddBtn" style="padding: 0.8rem 1.5rem; background: #45a29e; color: #fff;">手動加入圖表</button>
                </div>
            </div>

            <div class="dashboard-section" id="dashboard">
                <!-- 圖表會透過 JS 動態產生在這裡 -->
            </div>
        </main>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
